<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Urbana FBLA — Thank You</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{--navy:#0a2e7f;--blue:#1d52bc;--gold:#f4ab19;--cobalt:#226add;--white:#ffffff;--black:#2d2b2b;--off-white:#f7f8fc;--border:#dde3f0;--muted:#5a6485;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'DM Sans',Arial,sans-serif;color:var(--black);background:var(--off-white);font-size:16px;line-height:1.6;}
    nav{position:sticky;top:0;z-index:100;background:var(--navy);border-bottom:3px solid var(--gold);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:66px;box-shadow:0 2px 16px rgba(10,46,127,.18);}
    .nav-logo{display:flex;align-items:center;text-decoration:none;}
    .nav-links{display:flex;gap:.1rem;list-style:none;}
    .nav-links a{display:block;color:rgba(255,255,255,.82);text-decoration:none;font-size:.82rem;font-weight:500;padding:.45rem .9rem;border-radius:6px;letter-spacing:.06em;text-transform:uppercase;transition:color .18s,background .18s;}
    .nav-links a:hover{color:var(--gold);background:rgba(244,171,25,.1);}
    .menu-btn{display:none;background:none;border:none;cursor:pointer;padding:.5rem;flex-direction:column;gap:5px;}
    .menu-btn span{display:block;width:24px;height:2px;background:var(--white);border-radius:2px;}
    @media(max-width:720px){.menu-btn{display:flex;}.nav-links{display:none;position:absolute;top:66px;left:0;right:0;background:var(--navy);flex-direction:column;padding:.75rem 1rem 1rem;border-bottom:3px solid var(--gold);}.nav-links.open{display:flex;}.nav-links a{font-size:.9rem;padding:.65rem 1rem;}}
    footer{background:var(--navy);border-top:3px solid var(--gold);color:rgba(255,255,255,.55);text-align:center;padding:2rem;font-size:.82rem;}
    footer strong{color:var(--gold);}
    .thankyou-section{min-height:70vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:4rem 2rem;}
    .thankyou-box{max-width:520px;}
    .checkmark{font-size:3.5rem;margin-bottom:1.25rem;}
    .label{font-size:.72rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--cobalt);margin-bottom:.5rem;}
    h1{font-weight:700;font-size:2.2rem;color:var(--navy);margin-bottom:.75rem;}
    .divider{width:48px;height:4px;background:var(--gold);border-radius:2px;margin:.75rem auto 1.5rem;}
    p{color:var(--muted);font-size:.97rem;line-height:1.7;margin-bottom:2rem;}
    .btn{display:inline-block;padding:.75rem 1.75rem;border-radius:6px;font-family:'DM Sans',Arial,sans-serif;font-size:.88rem;font-weight:600;text-decoration:none;letter-spacing:.05em;text-transform:uppercase;transition:all .2s;border:2px solid transparent;background:var(--navy);color:var(--white);}
    .btn:hover{background:var(--blue);transform:translateY(-2px);}
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="nav-logo">
      <img src="https://res.cloudinary.com/dmgisz0pf/image/upload/f_auto,q_auto,h_124/v1777949175/logo_z9kpxp.png" alt="Urbana FBLA" style="height:62px;width:auto;display:block;">
    </a>
    <button class="menu-btn" onclick="document.getElementById('nl').classList.toggle('open')" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" id="nl">
      <li><a href="index.html">Home</a></li>
      <li><a href="events.html">Events</a></li>
      <li><a href="officers.html">Officers</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <section class="thankyou-section">
    <div class="thankyou-box">
      <div class="checkmark">✅</div>
      <p class="label">Message Received</p>
      <h1>Thank You!</h1>
      <div class="divider"></div>
      <p>Your message has been sent successfully. We'll get back to you soon.</p>
      <a href="index.html" class="btn">Back to Home</a>
    </div>
  </section>

  <footer>
    <p>© 2026 <strong>Urbana FBLA</strong> · Urbana High School · Ijamsville, MD <span class="egg" onclick="this.classList.toggle('show')"></span></p>
    <p style="margin-top:.35rem;font-size:.75rem;opacity:.4;">Future Business Leaders of America</p>
  </footer>
  <script>
    document.querySelectorAll('.nav-links a').forEach(a=>a.addEventListener('click',()=>document.getElementById('nl').classList.remove('open')));
  </script>

  <!-- 🥚 -->
  <style>
    .egg{display:inline-block;width:10px;height:10px;border-radius:50%;background:rgba(244,171,25,.1);cursor:pointer;margin-left:.6rem;vertical-align:middle;transition:background .2s;position:relative;}
    .egg:hover{background:var(--gold);}
    .egg::after{content:'jackson was here 👋';position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:var(--gold);font-family:"DM Sans",Arial,sans-serif;font-size:.75rem;font-weight:600;padding:.35rem .75rem;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .25s;border:1px solid rgba(244,171,25,.3);}
    .egg:hover::after,.egg.show::after{opacity:1;}
  </style>
</body>
</html>
